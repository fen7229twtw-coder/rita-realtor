<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RITA 修圖系統</title>
<style>
:root{
  --primary:#005335; --primary-deep:#0B2E20; --secondary:#4FAF38;
  --bg:#F4F7F4; --surface:#fff; --border:#DFE9E2;
  --text:#173D30; --muted:#6A7D74; --accent:#D8261C;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
  background:linear-gradient(160deg,#0B2E20 0%,#005335 55%,#0d3d29 100%);
  color:var(--text); min-height:100vh; display:grid; place-items:center;
  padding:24px; -webkit-font-smoothing:antialiased;
}
.card{
  background:var(--surface); width:100%; max-width:420px;
  border-radius:20px; padding:40px 32px 32px;
  box-shadow:0 20px 60px rgba(0,0,0,.28);
}
.mark{
  width:52px;height:52px;border-radius:15px;margin:0 auto 20px;
  background:linear-gradient(140deg,var(--primary),var(--secondary));
  display:grid;place-items:center;color:#fff;font-size:25px;
}
h1{font-size:20px;font-weight:800;text-align:center;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);font-size:13.5px;margin:8px 0 26px;line-height:1.7}
label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:var(--primary)}
input[type=password]{
  width:100%;padding:14px 16px;font-size:17px;letter-spacing:2px;
  border:2px solid var(--border);border-radius:12px;outline:none;
  font-family:inherit;background:#FAFCFA;transition:border-color .15s;
}
input[type=password]:focus{border-color:var(--secondary);background:#fff}
button{
  width:100%;margin-top:16px;padding:14px;font-size:16px;font-weight:800;
  color:#fff;background:var(--primary);border:0;border-radius:12px;cursor:pointer;
  font-family:inherit;letter-spacing:1px;transition:background .15s;
}
button:hover{background:#0a6b46}
button:disabled{background:#9BB3A7;cursor:default}
.remember{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--muted)}
.remember input{width:16px;height:16px;accent-color:var(--primary)}
.msg{margin-top:16px;font-size:13.5px;line-height:1.75;min-height:20px}
.msg.err{color:var(--accent)}
.msg.wait{color:var(--muted)}
.foot{
  margin-top:26px;padding-top:18px;border-top:1px solid var(--border);
  font-size:12px;color:var(--muted);line-height:1.8;
}
.foot b{color:var(--primary)}
</style>
</head>
<body>
<div class="card" id="gate">
  <div class="mark">✦</div>
  <h1>RITA 修圖系統</h1>
  <p class="sub">房產照片進來，591 可以直接上傳的圖出去</p>
  <label for="pw">密碼</label>
  <input type="password" id="pw" autocomplete="current-password" autofocus
         placeholder="請輸入密碼" enterkeyhint="go">
  <button id="go">開始使用</button>
  <div class="remember">
    <input type="checkbox" id="rem" checked>
    <label for="rem" style="margin:0;font-weight:400;color:var(--muted);cursor:pointer">
      這台電腦記住密碼</label>
  </div>
  <p class="msg" id="msg"></p>
  <div class="foot">
    <b>你的照片不會被上傳。</b>整套程式在你自己的瀏覽器裡跑，
    照片從頭到尾沒有離開這台電腦。
  </div>
</div>

const KEY_STORE = 'rita-photo-pw';

const $ = (id) => document.getElementById(id);
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function unlock(password, quiet) {
  const msg = $('msg');
  if (!password) { msg.className = 'msg err'; msg.textContent = '請先輸入密碼。'; return false; }
  $('go').disabled = true;
  if (!quiet) { msg.className = 'msg wait'; msg.textContent = '解鎖中…'; }

  let payload;
  try {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(password),
      'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(SEALED.salt), iterations: SEALED.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const buf = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64(SEALED.iv) }, key, b64(SEALED.data));
    payload = JSON.parse(new TextDecoder().decode(buf));
  } catch (e) {
    $('go').disabled = false;
    msg.className = 'msg err';
    msg.textContent = quiet ? '記住的密碼失效了，請重新輸入。' : '密碼不對。';
    localStorage.removeItem(KEY_STORE);
    return false;
  }

  if ($('rem').checked) { try { localStorage.setItem(KEY_STORE, password); } catch {} }

  /* 密碼對了 —— 把整套程式接起來。

     ES module 之間是用 './engine.js' 這種相對路徑互相引用的，
     但現在程式在記憶體裡、沒有真的檔案，那些路徑會找不到東西。
     所以要依相依順序一個一個做成 blob 網址，
     每做好一個就把後面檔案裡對它的引用改寫成那個網址。 */
  /* Logo 要在 app.js 跑起來之前掛好 */
  if (payload.logo) window.__UCH_LOGO__ = payload.logo;

  const urls = {};
  for (const name of payload.order) {
    let src = payload.files[name];
    for (const [dep, url] of Object.entries(urls)) {
      src = src.split("'./" + dep + "'").join("'" + url + "'")
               .split('"./' + dep + '"').join('"' + url + '"');
    }
    urls[name] = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  }

  document.documentElement.innerHTML = payload.html
    .replace(/^[\s\S]*?<html[^>]*>/i, '')
    .replace(/<\/html>\s*$/i, '');

  await import(urls['app.js']);
  return true;
}

$('go').onclick = () => unlock($('pw').value.trim(), false);
$('pw').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };

/* 記住過的話直接開，不要讓人每次都打一次 */
(async () => {
  if (!crypto.subtle) {
    $('msg').className = 'msg err';
    $('msg').textContent = '這個瀏覽器打不開（需要 https 連線）。請用 Chrome 或 Edge 開。';
    $('go').disabled = true;
    return;
  }
  const saved = localStorage.getItem(KEY_STORE);
  if (saved) { $('pw').value = saved; await unlock(saved, true); }
})();
</script>
